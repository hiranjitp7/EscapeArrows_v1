<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape Arrows!</title>
<link rel="preload" as="image" href="./assets/escape-arrows-icon.png">
<script>
(()=>{
  const buildId='__ESCAPE_ARROWS_BUILD_ID__',cacheKey='escapeArrows.startupBuild';let warm=false;
  try{warm=localStorage.getItem(cacheKey)===buildId;}catch{}
  document.documentElement.dataset.eaStartup=warm?'warm':'cold';
  window.__escapeArrowsStartup={buildId,cacheKey,warm,startedAt:performance.now()};
  window.finishEscapeArrowsStartup=()=>{
    const state=window.__escapeArrowsStartup;if(!state)return;
    try{localStorage.setItem(state.cacheKey,state.buildId);}catch{}
    if(state.warm)return;
    const splash=document.getElementById('launch-screen');if(!splash)return;
    const wait=Math.max(0,520-(performance.now()-state.startedAt));
    window.setTimeout(()=>{splash.classList.add('leaving');window.setTimeout(()=>splash.remove(),280);},wait);
  };
})();
</script>

function seededRandom(seed){

function smoothPath(points,steps=10){
  if(points.length<2)return {points:points.map(p=>p.slice()),lengths:[0],marks:[0]};
  const curve=(p0,p1,p2,p3,t)=>{
    const t2=t*t,t3=t2*t;

      .5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
      .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
    ];
  };
  const path=[points[0].slice()],lengths=[0],marks=[0];let total=0;
  for(let i=0;i<points.length-1;i++){
    const p1=points[i],p2=points[i+1];
    const p0=i?points[i-1]:[2*p1[0]-p2[0],2*p1[1]-p2[1]];
    const p3=i+2<points.length?points[i+2]:[2*p2[0]-p1[0],2*p2[1]-p1[1]];
    for(let j=1;j<=steps;j++){
      const p=curve(p0,p1,p2,p3,j/steps),prev=path[path.length-1];
      total+=Math.hypot(p[0]-prev[0],p[1]-prev[1]);path.push(p);lengths.push(total);
    }

// Solvable by construction: each snake's exit ray is clear of every snake placed before it,
// so removing snakes in reverse placement order always works.
function gen(cols,rows,level=1,rng=Math.random){
  const occ=new Set(),snakes=[],k=(x,y)=>x+','+y;
  const inb=(x,y)=>x>=0&&y>=0&&x<cols&&y<rows;
  const rayClear=(cells,d)=>{
    let [x,y]=cells[cells.length-1];x+=d[0];y+=d[1];
    while(inb(x,y)){
      if(occ.has(k(x,y))||cells.some(c=>c[0]==x&&c[1]==y))return false;
      x+=d[0];y+=d[1];
    }
    return true;
  };
  // Keep regular-level density steady; lighter boards are reserved for mechanic introductions.
  const attemptBudget=cols*rows*8;
  const minLen=Math.min(2+Math.floor(level/8),5);
  const maxLen=Math.min(minLen+(level>=101?5:4),level>=101?10:level>=51?9:8);
  for(let t=0;t<attemptBudget;t++){
    const starts=[];let bestAdjacency=-1;
    for(let sx=0;sx<cols;sx++)for(let sy=0;sy<rows;sy++){
      if(occ.has(k(sx,sy)))continue;
      const adjacent=[[1,0],[-1,0],[0,1],[0,-1]].reduce((n,d)=>n+(occ.has(k(sx+d[0],sy+d[1]))?1:0),0);
      if(adjacent>bestAdjacency)bestAdjacency=adjacent;
      starts.push({x:sx,y:sy,adjacent});
    }
    if(!starts.length)break;
    const compact=starts.filter(p=>p.adjacent>=bestAdjacency-(level<26?1:0));
    const {x,y}=compact[Math.floor(rng()*compact.length)];
    const cells=[[x,y]],tmp=new Set([k(x,y)]),len=minLen+Math.floor(rng()*(maxLen-minLen+1));
    let d=null;
    while(cells.length<len){
      const [cx,cy]=cells[cells.length-1];
      const opts=shuffle(DIRS.slice(),rng).filter(v=>{
        const nx=cx+v[0],ny=cy+v[1];
        return inb(nx,ny)&&!occ.has(k(nx,ny))&&!tmp.has(k(nx,ny));

}
function showcaseLevel(level,cols,rows){

    24:{dir:1,gateRows:[1,5,9],extraRows:[3,7,12]},
    25:{dir:-1,gateRows:[1,4,7],extraRows:[10,12]},
    26:{dir:1,gateRows:[2,6,10],extraRows:[4,8,12]},
    27:{dir:-1,gateRows:[1,5,9],extraRows:[3,7,11,13]},
    28:{dir:1,gateRows:[2,5,8],extraRows:[11,13]},
    29:{dir:-1,gateRows:[1,4,7],extraRows:[9,11,13]},

    [[[1,2],[2,2]],[1,0]],
    [[[4,3],[4,2]],[0,-1]],
    [[[1,6],[2,6]],[1,0]]

    [[[1,2],[2,2]],[1,0]],
    [[[6,5],[5,5]],[-1,0]],
    [[[4,3],[4,2]],[0,-1]],
    [[[4,4],[4,5]],[0,1]],
    [[[7,8],[8,8]],[1,0]],
    [[[1,8],[2,8]],[1,0]]

    [[[1,2],[2,2]],[1,0]],
    [[[7,2],[8,2]],[1,0]],
    [[[4,4],[5,4]],[1,0],{portal:{entry:[6,4],destination:[5,10],d:[0,1]}}],
    [[[1,8],[2,8]],[1,0]],
    [[[1,11],[2,11]],[1,0]]
  ]);

    [[[1,2],[2,2]],[1,0]],
    [[[6,5],[5,5]],[-1,0]],
    [[[1,9],[2,9]],[1,0]],
    [[[4,3],[4,2]],[0,-1]],
    [[[4,4],[4,5]],[0,1]],
    [[[7,9],[8,9]],[1,0]],
    [[[7,8],[8,8]],[1,0]],
    [[[1,12],[2,12]],[1,0]]

  return null;
}

  addPortalPair(rng){
    if(this.snakes.some(s=>s.portal)){this.specials=this.snakes.filter(s=>s.portal);return;}
    const routes=[];
    for(const snake of this.snakes.slice().reverse()){
      const [hx,hy]=snake.cells[snake.cells.length-1],entry=[hx+snake.d[0],hy+snake.d[1]];
      if(entry[0]<0||entry[1]<0||entry[0]>=this.cols||entry[1]>=this.rows)continue;
      const other=new Set();
      this.snakes.forEach(s=>{if(s!==snake)s.cells.forEach(([x,y])=>other.add(x+','+y));});
      if(other.has(entry.join(',')))continue;
      for(let x=0;x<this.cols;x++)for(let y=0;y<this.rows;y++){
        if(x===entry[0]&&y===entry[1]||other.has(x+','+y))continue;
        for(const d of DIRS){
          const shiftX=x-entry[0],shiftY=y-entry[1];
          const body=snake.cells.map(([sx,sy])=>[sx+snake.d[0]+shiftX,sy+snake.d[1]+shiftY]);
          const bodySet=new Set(body.map(c=>c.join(',')));
          if(body.some(([bx,by])=>bx<0||by<0||bx>=this.cols||by>=this.rows||other.has(bx+','+by))||bodySet.size!==body.length)continue;
          let px=x+d[0],py=y+d[1],clear=true;
          while(px>=0&&py>=0&&px<this.cols&&py<this.rows){
            if(other.has(px+','+py)||bodySet.has(px+','+py)){clear=false;break;}
            px+=d[0];py+=d[1];
          }
          if(clear)routes.push({snake,entry,destination:[x,y],d});
        }
      }
    }
    if(!routes.length)return;
    const route=routes[Math.floor(rng()*routes.length)];
    route.snake.portal={entry:route.entry,destination:route.destination,d:route.d};
    this.specials.push(route.snake);
  }

      const [hx,hy]=pts[pts.length-1],[dx,dy]=s.d,elapsed=this.time.now-fxStart;
      fx.clear();
      fx.lineStyle(this.cs*.52,0x00e5ff,.13);fx.beginPath();fx.moveTo(hx-dx*this.cs*.62,hy-dy*this.cs*.62);fx.lineTo(hx+dx*this.cs*.18,hy+dy*this.cs*.18);fx.strokePath();
      fx.lineStyle(this.cs*.2,0xff35d3,.32);fx.beginPath();fx.moveTo(hx-dx*this.cs*.5,hy-dy*this.cs*.5);fx.lineTo(hx+dx*this.cs*.22,hy+dy*this.cs*.22);fx.strokePath();
      fx.lineStyle(this.cs*.035,0xb9ffff,.95);fx.beginPath();fx.moveTo(hx-dx*this.cs*.42,hy-dy*this.cs*.42);fx.lineTo(hx+dx*this.cs*.23,hy+dy*this.cs*.23);fx.strokePath();
      const ring=(elapsed%220)/220;
      fx.lineStyle(this.cs*.025,0x00f5ff,1-ring*.8);fx.strokeCircle(hx,hy,this.cs*(.12+ring*.5));
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4+elapsed*.006,r=this.cs*(.2+.1*Math.sin(elapsed*.025+i));
        fx.lineStyle(this.cs*.035,i%2?0xff35d3:0x00f5ff,.9);
        fx.beginPath();fx.moveTo(hx+Math.cos(a)*r,hy+Math.sin(a)*r);
        fx.lineTo(hx+Math.cos(a)*(r+this.cs*.16),hy+Math.sin(a)*(r+this.cs*.16));fx.strokePath();
      }
    };
    const forwardMs=Math.min(420,Math.max(180,lunge/this.cs*115));
    this.busy=true;
    this.tweens.chain({targets:motion,tweens:[
      {distance:lunge,duration:forwardMs,ease:'Cubic.easeOut',onUpdate:draw},
      {distance:0,duration:forwardMs*1.45,ease:'Bounce.easeOut',onUpdate:draw}
    ],onComplete:()=>{
      this.render(s,s.body);fx.destroy();
      if(this.mist>=3){this.gameOver();return;}
      this.busy=false;
    }});
    this.cameras.main.flash(50,125,35,50);
  }
  gameOver(){
    this.busy=true;
    this.time.delayedCall(250,()=>{
      if(this.daily){
        this.busy=false;
        this.showAdPrompt('DAILY CHALLENGE FAILED','Watch ad for another attempt',
          ()=>this.time.delayedCall(80,()=>this.scene.restart({level:this.level,daily:true,seed:this.dailySeed})),
          ()=>this.time.delayedCall(80,()=>this.scene.restart({level:Math.max(1,this.profile.level)})));
        return;
      }
      this.add.rectangle(W/2,H/2,W,H,0x0b0c18,.9).setDepth(30);
      this.add.text(W/2,UI_Y(250),'Out of stars',{fontSize:'30px',fontFamily:FONT,fontStyle:'bold',color:'#fff'}).setOrigin(.5).setDepth(31);
      this.add.text(W/2,UI_Y(310),'☆☆☆',{fontSize:'44px',fontFamily:FONT,color:'#65718d'}).setOrigin(.5).setDepth(31);
      let selected=false;
      this.add.text(W/2,UI_Y(390),'Restart level',{fontSize:'23px',fontFamily:FONT,fontStyle:'bold',color:'#0b0c18',backgroundColor:'#00f5ff',padding:{x:22,y:12}})
        .setOrigin(.5).setDepth(31).setInteractive().on('pointerdown',()=>{
          if(selected)return;selected=true;this.time.delayedCall(80,()=>this.scene.restart({level:this.level}));
        });
    });
  }
  win(){
    this.busy=true;
    const n=Math.max(1,3-this.mist);
    const elapsed=Math.max(1,Math.round((Date.now()-(this.levelStartedAt||Date.now()))/1000));
    const medals=[];
    if(this.mist===0)medals.push('FLAWLESS');
    if(this.hintsUsed===0)medals.push('NO HINTS');
    const minimumMoves=this.snakes.length+this.snakes.filter(s=>s.needsTap).length+(this.initialRotations-this.rotations);
    if(this.moves<=minimumMoves+1)medals.push('LOW MOVES');
    const results=this.profile.results||(this.profile.results={});
    const resultKey=this.daily?`daily:${dateKey()}`:String(this.level);
    const isFirstClear=!this.daily&&(this.adManager?
      this.adManager.recordLevelClear(this.level,!!results[String(this.level)]):!results[String(this.level)]);
    const record=results[resultKey]||{bestTime:Infinity,bestMoves:Infinity,medals:[]};
    const newMedals=medals.filter(medal=>!record.medals.includes(medal));
    record.bestTime=Math.min(record.bestTime,elapsed);
    record.bestMoves=Math.min(record.bestMoves,this.moves);
    record.medals=[...new Set([...record.medals,...medals])];
    results[resultKey]=record;
    if(!this.daily){
      this.profile.level=Math.max(this.profile.level||1,this.level+1);
      this.profile.levelSelectCelebration={level:this.level,medals:newMedals.slice()};
    }
    if(this.daily){
      const today=dateKey(),yesterday=new Date();yesterday.setUTCDate(yesterday.getUTCDate()-1);
      if(this.profile.dailyChallengeLastCompletedDate!==today){
        this.profile.dailyChallengeStreak=this.profile.dailyChallengeLastCompletedDate===dateKey(yesterday)?(this.profile.dailyChallengeStreak||0)+1:1;
        this.profile.dailyChallengeLastCompletedDate=today;
      }else if(!Number.isInteger(this.profile.dailyChallengeStreak))this.profile.dailyChallengeStreak=1;
      this.profile.dailyDate=today;
    }
    const gallery=this.profile.gallery||(this.profile.gallery=[]);
    const rewardItem=this.shapeReward;
    const shapeName=rewardItem?.name||null;
    const newlyCollected=!!rewardItem&&!gallery.includes(rewardItem.id);
    if(rewardItem&&!gallery.includes(rewardItem.id))gallery.push(rewardItem.id);
    writeProfile(this.profile);
    if(this.daily&&this.dailyT)this.dailyT.setText('DAILY ✓');
    this.playFeedback(newlyCollected?'combo':newMedals.length?'combo':'clear',newlyCollected?90:newMedals.length?72:48);
    for(let i=0;i<4;i++)this.time.delayedCall(i*140,()=>this.comboBurst(W/2+(Math.random()-.5)*140,220+Math.random()*180,true));
    let completionAction=false;
    this.time.delayedCall(500,()=>{
      const chooseCompletionAction=(data,showInterstitial=false)=>{
        if(completionAction)return;completionAction=true;
        const continueToNext=()=>this.time.delayedCall(80,()=>this.scene.restart(data));
        if(showInterstitial)void this.runInterstitialAd(this.level,isFirstClear).finally(continueToNext);
        else continueToNext();
      };
      this.add.rectangle(W/2,H/2,W,H,0x0b0c18,.88).setDepth(30);
      this.add.text(W/2,UI_Y(132),this.daily?'DAILY CHALLENGE CLEAR':'LEVEL '+this.level+' CLEAR',{fontSize:'24px',fontFamily:FONT,fontStyle:'bold',color:'#fff'}).setOrigin(.5).setDepth(31);
      const rewardArt=this.add.graphics().setDepth(31);
      const artY=UI_Y(211);
      if(shapeName)this.drawCollectibleArt(rewardArt,this.shapeId,W/2,artY,newlyCollected?78:66,this.theme.colors[2],.95);
      else{
        rewardArt.lineStyle(3,this.theme.colors[2],.9);rewardArt.strokeCircle(W/2,artY,30);
        rewardArt.fillStyle(this.theme.colors[2],.45);rewardArt.fillCircle(W/2,artY,20);
        this.add.text(W/2,artY,'✦',{fontSize:'28px',fontFamily:FONT,color:'#ffffff'}).setOrigin(.5).setDepth(32);
      }
      if(newlyCollected){
        const ring=this.add.circle(W/2,artY,44,0x00d9c5,.1).setStrokeStyle(2,0x4cc9f0,.8).setDepth(30);
        this.tweens.add({targets:ring,scale:1.12,alpha:.35,duration:260,yoyo:true,repeat:1,ease:'Sine.easeInOut',onComplete:()=>ring.destroy()});
      }
      const artLabel=shapeName?(newlyCollected?`NEW ARTWORK!  •  ${shapeName}`:`${shapeName} • ALREADY COLLECTED`):this.shapeId?`SHAPE REVEALED • NEXT ART AT LEVEL ${COLLECTION_ITEMS.find(item=>item.level>this.level)?.level||'—'}`:`${this.theme.name.toUpperCase()} • LEVEL CLEARED`;
      this.add.text(W/2,UI_Y(263),artLabel,{fontSize:newlyCollected?'14px':'13px',fontFamily:FONT,fontStyle:'bold',color:newlyCollected?'#ffdf70':'#8affff'}).setOrigin(.5).setDepth(31);
      const collectionCount=gallery.length,progress=this.add.graphics().setDepth(31);
      progress.fillStyle(0x30364f,1);progress.fillRoundedRect(76,UI_Y(280),208,7,4);
      if(collectionCount) {progress.fillStyle(0x00d9c5,1);progress.fillRoundedRect(76,UI_Y(280),208*collectionCount/COLLECTION_ITEMS.length,7,4);}
      this.add.text(W/2,UI_Y(299),`ART COLLECTION  ${collectionCount}/${COLLECTION_ITEMS.length}`,{fontSize:'12px',fontFamily:FONT,fontStyle:'bold',color:'#e2eaff'}).setOrigin(.5).setDepth(31);
      const earnedStars=this.add.text(W/2,UI_Y(334),'★'.repeat(n)+'☆'.repeat(3-n),{fontSize:'36px',fontFamily:FONT,color:'#ffd166'}).setOrigin(.5).setDepth(31);
      if(n===3)this.tweens.add({targets:earnedStars,scale:1.16,duration:220,ease:'Back.easeOut',yoyo:true,delay:120});
      this.add.text(W/2,UI_Y(371),`${this.moves} MOVES  •  ${this.hintsUsed} HINTS  •  ${elapsed}s`,{fontSize:'13px',fontFamily:FONT,color:'#ffffff'}).setOrigin(.5).setDepth(31);
      const medalDefs=[['FLAWLESS',this.mist===0,'NO MISTAKES'],['NO HINTS',this.hintsUsed===0,'ZERO HINTS'],['LOW MOVES',this.moves<=minimumMoves+1,'NEAR-PERFECT ROUTE']];
      const medalCard=this.add.graphics().setDepth(31);
      medalDefs.forEach((medal,i)=>{
        const x=70+i*110,current=medal[1],past=!current&&record.medals.includes(medal[0]),textX=x+9;
         medalCard.fillStyle(current?0x29304b:past?0x22283e:0x1a1e31,.98);medalCard.fillRoundedRect(x-48,UI_Y(386),96,43,6);
         this.drawStar(medalCard,x-32,UI_Y(407),10,current?0xffdf70:past?0x85839a:0x59617a,.9);
         this.add.text(textX,UI_Y(400),medal[0],{fontSize:'10px',fontFamily:FONT,fontStyle:'bold',color:current?'#ffdf70':past?'#aeb9ce':'#c1cbe0'}).setOrigin(.5).setDepth(32);
         this.add.text(textX,UI_Y(414),current?'✓ EARNED':past?'✓ BEST RUN':'LOCKED',{fontSize:'8.5px',fontFamily:FONT,color:current?'#a9ffff':past?'#aeb9ce':'#a6b1c8'}).setOrigin(.5).setDepth(32);
      });
      this.add.text(W/2,UI_Y(444),`BEST ${record.bestTime}s  •  ${record.bestMoves} MOVES`,{fontSize:'12px',fontFamily:FONT,color:'#a9ffff'}).setOrigin(.5).setDepth(31);
      this.add.text(W/2,UI_Y(465),newMedals.length?`${record.medals.length} / 3 MEDALS  •  EARNED: ${newMedals.join(' + ')}`:`${record.medals.length} / 3 MEDALS`,{fontSize:'11px',fontFamily:FONT,fontStyle:'bold',color:newMedals.length?'#ff8aff':'#aebbd4',align:'center'}).setOrigin(.5).setDepth(31);
      const completionButton=(y,label,width,height,fill,textColor,fontSize,onClick)=>{
        const bg=this.add.graphics();bg.fillStyle(fill,1);bg.fillRoundedRect(-width/2,-height/2,width,height,9);
        const text=this.add.text(0,0,label,{fontSize:fontSize+'px',fontFamily:FONT,fontStyle:'bold',color:textColor,align:'center'}).setOrigin(.5);
        const button=this.add.container(W/2,UI_Y(y),[bg,text]).setSize(width,height).setDepth(31)
          .setInteractive(new Phaser.Geom.Rectangle(0,0,width,height),Phaser.Geom.Rectangle.Contains);
        this.markButton(button);
        button.on('pointerdown',(_,x,y,event)=>{event.stopPropagation();onClick();});
      };
      completionButton(505,'REPLAY LEVEL',208,42,0x29243a,'#ffffff',17,()=>chooseCompletionAction({level:this.level,daily:this.daily,seed:this.dailySeed}));
      const interstitialEligible=!this.daily&&isFirstClear&&this.level>=8&&(this.level-8)%4===0;
      completionButton(558,this.daily?'BACK TO LEVELS':'NEXT LEVEL',250,50,0x57d8ff,'#071624',19,
        ()=>chooseCompletionAction({level:this.daily?Math.max(1,this.profile.level):this.level+1},interstitialEligible));
    });
  }
}

async function bootGame(){
  const preferences=window.ArrowNative?.Preferences;
  if(preferences){
    try{
      const {value}=await preferences.get({key:'arrowPathProfile'});
      if(value){profileCache=JSON.parse(value);localStorage.setItem('arrowPathProfile',value);}
    }catch{}
  }
  new Phaser.Game({type:Phaser.AUTO,parent:'g',width:W*RENDER_SCALE,height:H*RENDER_SCALE,backgroundColor:'#14162b',
    render:{antialias:true,antialiasGL:true,roundPixels:false},
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Play]});
  window.ArrowNative?.ads?.onBannerHeightChange(height=>{
    if(!window.ArrowNative?.Capacitor?.isNativePlatform())return;
    gameViewport.style.bottom=height?`calc(env(safe-area-inset-bottom,0px) + ${height+12}px)`:'env(safe-area-inset-bottom,0px)';
  });
  void window.ArrowNative?.ads?.initialize();
}
bootGame();
</script>
