<script>
(()=>{
  const buildId='__ESCAPE_ARROWS_BUILD_ID__',cacheKey='escapeArrows.startupBuild';let warm=false;
  try{warm=localStorage.getItem(cacheKey)===buildId;}catch{}
  document.documentElement.dataset.eaStartup=warm?'warm':'cold';
   window.__escapeArrowsStartup={buildId,cacheKey,warm,startedAt:performance.now(),reducedMotion:!!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches};
  window.finishEscapeArrowsStartup=()=>{
    const state=window.__escapeArrowsStartup;if(!state)return;
    try{localStorage.setItem(state.cacheKey,state.buildId);}catch{}
    if(state.warm)return;
    const splash=document.getElementById('launch-screen');if(!splash)return;
     const wait=state.reducedMotion?0:Math.max(0,520-(performance.now()-state.startedAt));
     window.setTimeout(()=>{splash.classList.add('leaving');window.setTimeout(()=>splash.remove(),state.reducedMotion?0:280);},wait);
  };
})();
</script>

      if(other.has(entry.join(',')))continue;

          const body=snake.cells.map(([sx,sy])=>[sx+snake.d[0]+shiftX,sy+snake.d[1]+shiftY]);

    const search=(done,dirs,turns,armed)=>{
      if(done.every(Boolean))return true;
      const key=`${done.map(Boolean).map(Number).join('')}:${dirs.map(encode).join('')}:${turns}:${armed.map(Boolean).map(Number).join('')}`;
      if(memo.has(key))return memo.get(key);
      if(++states>stateCap){memo.set(key,false);return false;}
      const active=snakes.map((snake,index)=>({...snake,d:dirs[index],done:done[index]}));
      const scene={snakes:active,cols:this.cols,rows:this.rows,portal,portalTrace:this.portalTrace,portalMove:this.portalMove};

        for(let step=1;step<TURN_DIRS.length;step++){
          const nextDirection=TURN_DIRS[(start+step)%TURN_DIRS.length];

  drawCompletionMedals(medalDefs,recordMedals,contentWidth){
    const card=this.add.graphics().setDepth(31),gap=8,chipHeight=54;
    const chipWidth=(contentWidth-gap*(medalDefs.length-1))/medalDefs.length,left=(W-contentWidth)/2,top=UI_Y(382);
    // Full-width, single-line labels: never fit medal text by scaling it below 12px.
    const labelFontSize=MIN_READABLE_FONT_SIZE,statusFontSize=MIN_READABLE_FONT_SIZE,displayNames={'LOW MOVES':'FEW MOVES'};
    medalDefs.forEach(([name,current],index)=>{
      const x=left+index*(chipWidth+gap),center=x+chipWidth/2,past=!current&&recordMedals.includes(name);
      card.fillStyle(current?0x29304b:past?0x22283e:0x1a1e31,.98);card.fillRoundedRect(x,top,chipWidth,chipHeight,6);
      this.drawStar(card,center,top+9,5.5,current?0xffdf70:past?0x85839a:0x59617a,current||past?0.9:0.55);
      this.add.text(center,top+26,displayNames[name]||name,{
        fontSize:labelFontSize+'px',fontFamily:FONT,fontStyle:'bold',color:current?'#ffdf70':past?'#aeb9ce':'#c1cbe0',align:'center',wordWrap:{width:0}
      }).setOrigin(.5).setDepth(32);
      const color=current?0xa9ffff:past?0xaebbd4:0xa6b1c8,statusY=top+44;
      const status=this.add.text(center,statusY,current?'EARNED':past?'BEST RUN':'LOCKED',{
        fontSize:statusFontSize+'px',fontFamily:FONT,color:'#'+color.toString(16).padStart(6,'0'),align:'center',wordWrap:{width:0}
      }).setOrigin(.5).setDepth(32);
      if(current||past){
        // Vector check + status text form one centered line, independent of font glyph support.
        const checkWidth=8,checkGap=4,checkX=center-(status.width+checkWidth+checkGap)/2;
        status.setX(center+(checkWidth+checkGap)/2);
        card.lineStyle(1.7,color,1);card.beginPath();card.moveTo(checkX,statusY-.5);
        card.lineTo(checkX+3,statusY+2.5);card.lineTo(checkX+checkWidth,statusY-3);card.strokePath();
      }
    });
  }
  win(){
    this.busy=true;
    this.lockHeaderForModal();
    const n=Math.max(1,3-this.mist);
    const elapsed=Math.max(1,Math.round((Date.now()-(this.levelStartedAt||Date.now()))/1000));
    const medals=[];
    if(this.mist===0)medals.push('FLAWLESS');
    if(this.hintsUsed===0)medals.push('NO HINTS');
    const minimumMoves=this.snakes.length+this.snakes.filter(s=>s.needsTap).length+(this.initialRotations-this.rotations);
    if(this.moves<=minimumMoves+1)medals.push('LOW MOVES');
    const results=this.profile.results||(this.profile.results={});
    const resultKey=this.daily?`daily:${dateKey()}`:String(this.level);
    const isFirstClear=!this.daily&&(this.adManager?
      this.adManager.recordLevelClear(this.level,!!results[String(this.level)]):!results[String(this.level)]);
    const record=results[resultKey]||{bestTime:Infinity,bestMoves:Infinity,medals:[]};
    const newMedals=medals.filter(medal=>!record.medals.includes(medal));
    record.bestTime=Math.min(record.bestTime,elapsed);
    record.bestMoves=Math.min(record.bestMoves,this.moves);
    record.medals=[...new Set([...record.medals,...medals])];
    results[resultKey]=record;
    if(!this.daily){
      this.profile.level=Math.max(this.profile.level||1,this.level+1);
      this.profile.levelSelectCelebration={level:this.level,medals:newMedals.slice()};
    }
    if(this.daily){
      const today=dateKey(),yesterday=new Date();yesterday.setUTCDate(yesterday.getUTCDate()-1);
      if(this.profile.dailyChallengeLastCompletedDate!==today){
        this.profile.dailyChallengeStreak=this.profile.dailyChallengeLastCompletedDate===dateKey(yesterday)?(this.profile.dailyChallengeStreak||0)+1:1;
        this.profile.dailyChallengeLastCompletedDate=today;
      }else if(!Number.isInteger(this.profile.dailyChallengeStreak))this.profile.dailyChallengeStreak=1;
      this.profile.dailyDate=today;
    }
    const gallery=this.profile.gallery||(this.profile.gallery=[]);
    const rewardItem=this.shapeReward;
    const shapeName=rewardItem?.name||null;
    const newlyCollected=!!rewardItem&&!gallery.includes(rewardItem.id);
    if(rewardItem&&!gallery.includes(rewardItem.id))gallery.push(rewardItem.id);
    writeProfile(this.profile);
    if(this.daily&&this.dailyT)this.dailyT.setText('DAILY ✓');
    this.playFeedback(newlyCollected?'combo':newMedals.length?'combo':'clear',newlyCollected?90:newMedals.length?72:48);
    for(let i=0;i<4;i++)this.time.delayedCall(i*140,()=>this.comboBurst(W/2+(Math.random()-.5)*140,220+Math.random()*180,true));
    let completionAction=false;
    this.time.delayedCall(500,()=>{
      const chooseCompletionAction=(data,showInterstitial=false)=>{
        if(completionAction)return;completionAction=true;
        const continueToNext=()=>this.time.delayedCall(80,()=>this.scene.restart(data));
        if(showInterstitial)void this.runInterstitialAd(this.level,isFirstClear).finally(continueToNext);
        else continueToNext();
      };
       this.add.rectangle(W/2,H/2,W,H,0x0b0c18,.88).setDepth(30);
       const clearContentWidth=modalInnerWidth(W),progressWidth=Math.min(208,clearContentWidth),progressX=(W-progressWidth)/2;
      this.add.text(W/2,UI_Y(132),this.daily?'DAILY CHALLENGE CLEAR':'LEVEL '+this.level+' CLEAR',{fontSize:'24px',fontFamily:FONT,fontStyle:'bold',color:'#fff'}).setOrigin(.5).setDepth(31);
      const rewardArt=this.add.graphics().setDepth(31);
      const artY=UI_Y(211);
      if(shapeName)this.drawCollectibleArt(rewardArt,this.shapeId,W/2,artY,newlyCollected?78:66,this.theme.colors[2],.95);
      else{
        rewardArt.lineStyle(3,this.theme.colors[2],.9);rewardArt.strokeCircle(W/2,artY,30);
        rewardArt.fillStyle(this.theme.colors[2],.45);rewardArt.fillCircle(W/2,artY,20);
        this.add.text(W/2,artY,'✦',{fontSize:'28px',fontFamily:FONT,color:'#ffffff'}).setOrigin(.5).setDepth(32);
      }
      if(newlyCollected){
        const ring=this.add.circle(W/2,artY,44,0x00d9c5,.1).setStrokeStyle(2,0x4cc9f0,.8).setDepth(30);
        this.tweens.add({targets:ring,scale:1.12,alpha:.35,duration:260,yoyo:true,repeat:1,ease:'Sine.easeInOut',onComplete:()=>ring.destroy()});
      }
      const artLabel=shapeName?(newlyCollected?`NEW ARTWORK!  •  ${shapeName}`:`${shapeName} • ALREADY COLLECTED`):this.shapeId?`SHAPE REVEALED • NEXT ART AT LEVEL ${COLLECTION_ITEMS.find(item=>item.level>this.level)?.level||'—'}`:`${this.theme.name.toUpperCase()} • LEVEL CLEARED`;
        this.add.text(W/2,UI_Y(263),artLabel,{fontSize:newlyCollected?'15px':'14px',fontFamily:FONT,fontStyle:'bold',color:newlyCollected?'#ffdf70':'#8affff',align:'center',wordWrap:{width:clearContentWidth}}).setOrigin(.5).setDepth(31);
       const collectionCount=gallery.length,progress=this.add.graphics().setDepth(31);
       progress.fillStyle(0x30364f,1);progress.fillRoundedRect(progressX,UI_Y(280),progressWidth,7,4);
       if(collectionCount) {progress.fillStyle(0x00d9c5,1);progress.fillRoundedRect(progressX,UI_Y(280),progressWidth*collectionCount/COLLECTION_ITEMS.length,7,4);}
       this.add.text(W/2,UI_Y(299),`ART COLLECTION  ${collectionCount}/${COLLECTION_ITEMS.length}`,{fontSize:'13px',fontFamily:FONT,fontStyle:'bold',color:'#e2eaff',align:'center',wordWrap:{width:clearContentWidth}}).setOrigin(.5).setDepth(31);
      const earnedStars=this.add.text(W/2,UI_Y(334),'★'.repeat(n)+'☆'.repeat(3-n),{fontSize:'36px',fontFamily:FONT,color:'#ffd166'}).setOrigin(.5).setDepth(31);
      if(n===3)this.tweens.add({targets:earnedStars,scale:1.16,duration:220,ease:'Back.easeOut',yoyo:true,delay:120});
        this.add.text(W/2,UI_Y(371),`${this.moves} MOVES  •  ${this.hintsUsed} HINTS  •  ${elapsed}s`,{fontSize:'15px',fontFamily:FONT,color:'#ffffff',align:'center',wordWrap:{width:clearContentWidth}}).setOrigin(.5).setDepth(31);
        const medalDefs=[['FLAWLESS',this.mist===0,'NO MISTAKES'],['NO HINTS',this.hintsUsed===0,'ZERO HINTS'],['LOW MOVES',this.moves<=minimumMoves+1,'NEAR-PERFECT ROUTE']];
        this.drawCompletionMedals(medalDefs,record.medals,clearContentWidth);
       this.add.text(W/2,UI_Y(444),`BEST ${record.bestTime}s  •  ${record.bestMoves} MOVES`,{fontSize:'13px',fontFamily:FONT,color:'#a9ffff',align:'center',wordWrap:{width:clearContentWidth}}).setOrigin(.5).setDepth(31);
       this.add.text(W/2,UI_Y(465),newMedals.length?`${record.medals.length} / 3 MEDALS  •  EARNED: ${newMedals.join(' + ')}`:`${record.medals.length} / 3 MEDALS`,{fontSize:'12px',fontFamily:FONT,fontStyle:'bold',color:newMedals.length?'#ff8aff':'#aebbd4',align:'center',wordWrap:{width:clearContentWidth,useAdvancedWrap:true}}).setOrigin(.5).setDepth(31);
      const completionButton=(y,label,width,height,fill,textColor,fontSize,onClick)=>{
        const bg=this.add.graphics();bg.fillStyle(fill,1);bg.fillRoundedRect(-width/2,-height/2,width,height,9);
        const text=this.add.text(0,0,label,{fontSize:fontSize+'px',fontFamily:FONT,fontStyle:'bold',color:textColor,align:'center'}).setOrigin(.5);
        const button=this.add.container(W/2,UI_Y(y),[bg,text]).setSize(width,height).setDepth(31)
          .setInteractive(containerHitArea(width,height),Phaser.Geom.Rectangle.Contains);
        this.markButton(button);
        button.on('pointerdown',(_,x,y,event)=>{event.stopPropagation();onClick();});
      };
       completionButton(505,'REPLAY LEVEL',clearContentWidth,42,0x29243a,'#ffffff',17,()=>chooseCompletionAction({level:this.level,daily:this.daily,seed:this.dailySeed}));
      const interstitialEligible=!this.daily&&isFirstClear&&this.level>=8&&(this.level-8)%4===0;
       completionButton(558,this.daily?'BACK TO LEVELS':'NEXT LEVEL',clearContentWidth,50,0x57d8ff,'#071624',19,
        ()=>chooseCompletionAction({level:this.daily?Math.max(1,this.profile.level):this.level+1},interstitialEligible));
    });
  }
}

async function bootGame(){
  const preferences=window.ArrowNative?.Preferences;
  if(preferences){
    try{
      const {value}=await preferences.get({key:'arrowPathProfile'});
      if(value){profileCache=JSON.parse(value);localStorage.setItem('arrowPathProfile',value);}
    }catch{}
  }
  new Phaser.Game({type:Phaser.AUTO,parent:'g',width:W*RENDER_SCALE,height:H*RENDER_SCALE,backgroundColor:'#14162b',
    render:{antialias:true,antialiasGL:true,roundPixels:false},
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Play]});
  window.ArrowNative?.ads?.onBannerHeightChange(height=>{
    if(!window.ArrowNative?.Capacitor?.isNativePlatform())return;
    gameViewport.style.bottom=height?`calc(env(safe-area-inset-bottom,0px) + ${height+12}px)`:'env(safe-area-inset-bottom,0px)';
  });
  void window.ArrowNative?.ads?.initialize();
}
bootGame();
</script>
