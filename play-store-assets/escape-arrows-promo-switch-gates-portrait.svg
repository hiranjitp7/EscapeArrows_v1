  <g opacity=".88" filter="url(#pGlow)"><path d="M288 1350h370" stroke="#ff35bb" stroke-width="7" stroke-linecap="round"/><circle cx="274" cy="1350" r="8" fill="#ff35bb"/><circle cx="672" cy="1350" r="8" fill="#ff35bb"/></g>
