  <path d="M74 1192H215Q262 1192 262 1145V1034H450Q493 1034 493 991V892" fill="none" stroke="#b5ffff" stroke-opacity=".45" stroke-width="9" stroke-linecap="round"/>
  <polygon points="493,807 421,920 565,920" fill="url(#cyan)" filter="url(#cGlow)"/>

