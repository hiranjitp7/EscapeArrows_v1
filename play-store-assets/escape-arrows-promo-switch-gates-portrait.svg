<svg xmlns="http://www.w3.org/2000/svg" width="941" height="1672" viewBox="0 0 941 1672">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09051c"/><stop offset=".5" stop-color="#1a0b31"/><stop offset="1" stop-color="#080419"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="60%"><stop stop-color="#3e1d59" stop-opacity=".7"/><stop offset=".52" stop-color="#1b123c" stop-opacity=".35"/><stop offset="1" stop-color="#0a061d" stop-opacity="0"/></radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#70ffff"/><stop offset=".48" stop-color="#00e4f2"/><stop offset="1" stop-color="#1288ff"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff78e7"/><stop offset=".5" stop-color="#ff269e"/><stop offset="1" stop-color="#a936ff"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff276"/><stop offset=".5" stop-color="#ffc51b"/><stop offset="1" stop-color="#f27c13"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8ffb0"/><stop offset=".5" stop-color="#43ef9e"/><stop offset="1" stop-color="#04bfc7"/></linearGradient>
    <filter id="cGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="yGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="43" height="43" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#b77be2" opacity=".18"/></pattern>
  </defs>
  <rect width="941" height="1672" fill="url(#bg)"/><rect width="941" height="1672" fill="url(#halo)"/><rect width="941" height="1672" fill="url(#dots)" opacity=".32"/>

