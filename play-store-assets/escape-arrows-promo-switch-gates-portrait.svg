    <rect x="96" y="529" width="148" height="148" rx="28"/><rect x="271" y="529" width="148" height="148" rx="28"/><rect x="446" y="529" width="148" height="148" rx="28"/><rect x="621" y="529" width="148" height="148" rx="28"/>
    <rect x="96" y="704" width="148" height="148" rx="28"/><rect x="271" y="704" width="148" height="148" rx="28"/><rect x="446" y="704" width="148" height="148" rx="28"/><rect x="621" y="704" width="148" height="148" rx="28"/>
    <rect x="96" y="879" width="148" height="148" rx="28"/><rect x="271" y="879" width="148" height="148" rx="28"/><rect x="446" y="879" width="148" height="148" rx="28"/><rect x="621" y="879" width="148" height="148" rx="28"/>
    <rect x="96" y="1054" width="148" height="148" rx="28"/><rect x="271" y="1054" width="148" height="148" rx="28"/><rect x="446" y="1054" width="148" height="148" rx="28"/><rect x="621" y="1054" width="148" height="148" rx="28"/>
